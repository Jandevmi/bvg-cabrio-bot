apiVersion: apps/v1
kind: Deployment
metadata:
  name: oetker-monitor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oetker-monitor
  template:
    metadata:
      labels:
        app: oetker-monitor
    spec:
      containers:
      - name: oetker-monitor
        image: registry.datexis.com/jfrick/oetker-monitor:latest
        imagePullPolicy: Always
        resources:
          requests:
            memory: "64Mi"
          limits:
            memory: "256Mi"
            cpu: "1"
        volumeMounts:
          - name: config
            mountPath: /config
            readOnly: true
      volumes:
        - name: config
          secret:
            secretName: oetker-monitor-config
      imagePullSecrets:
        - name: private-registry-auth
